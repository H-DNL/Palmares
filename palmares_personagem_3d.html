<style>
:root{color-scheme:dark;--ink:#f4ead8;--muted:#c7b69b;--panel:#17231fdd;--line:#ffffff25;--accent:#d99a58}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17231f;font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}

.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#e4b77e}

.sub{font-size:12px;color:var(--muted);letter-spacing:.04em}
.controls{position:fixed;z-index:4;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(95vw,760px);padding:10px;background:#101b18cc;border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px)}

button:hover,button.active{background:#785536;border-color:#d99a58}
button:focus-visible,input:focus-visible{outline:2px solid #f2c58d;outline-offset:2px}

input[type=range]{width:105px;accent-color:#d99a58}
#photo{background:#9b7045}

#info.open{transform:translateX(0)}
#info h2{font:22px Georgia,serif;margin:0 0 10px;color:#f1c28a}
#info p{font-size:13px;line-height:1.55;color:#e0d4c2;margin:0 0 9px}
#close{float:right;padding:4px 8px}
.hint{position:fixed;right:18px;bottom:94px;z-index:2;font-size:11px;color:#e8ddc9aa;text-align:right;pointer-events:none}
#photoExit{display:none;position:fixed;z-index:8;top:18px;right:18px}
body.photo .hud,body.photo .controls,body.photo .hint,body.photo #info{display:none}
body.photo #photoExit{display:block}
@media(max-width:560px){.hud{top:12px;left:12px}.sub{max-width:270px}.controls{bottom:9px;gap:5px;padding:7px}button{padding:8px 9px;font-size:11px}.timebox{width:100%;justify-content:center}.hint{bottom:115px}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* OPÇÃO A — LOW-POLY ESTILIZADO.
   Facetas simples e paleta restrita valorizam silhueta e leitura à distância. */

const CFG={
  height:1.75, skin:0x4a281e, skinLight:0x603426, hair:0x17120f,
  cloth:0xc4a77a, sash:0x914b35, wood:0x60402a, gold:0xc18b4c,
  ground:0x66513a, duration:{walk:1,windup:.3,thrust:.2,recover:.5},
  camera:{fov:34,near:.1,far:80}, fire:{x:1.35,z:-.65}
};
const MAT={};
let scene,camera,renderer,controls,character,rig,fireLight,fireGroup;
let clock=new THREE.Clock(), elapsed=0, pose='idle',poseTime=0,transition=1;
let raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),hovered=null;
let nextBlink=5.2,blinkStart=-10,nextLook=12.5,lookStart=-10,lookYaw=0;
let pickables=[],eyeMeshes=[],embers=[],dayValue=17;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a),0,1);return x*x*(3-2*x)};
const mat=(name,color,roughness=1)=>MAT[name]||(MAT[name]=new THREE.MeshStandardMaterial({color,roughness,flatShading:true}));
const group=(parent,name,x=0,y=0,z=0)=>{const g=new THREE.Group();g.name=name;g.position.set(x,y,z);parent.add(g);return g};
function mesh(parent,geometry,material,name,x=0,y=0,z=0){
  const m=new THREE.Mesh(geometry,material);m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function sphere(parent,name,pos,scale,material,segments=10){
  const m=mesh(parent,new THREE.IcosahedronGeometry(1,1),material,name,...pos);m.scale.set(...scale);return m;
}
function capsule(parent,name,a,b,r1,r2,material,radial=8){
  const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),dir=end.clone().sub(start);
  const m=mesh(parent,new THREE.CylinderGeometry(r2,r1,dir.length(),radial,1),material,name);
  m.position.copy(start).add(end).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  sphere(parent,name+' junta A',a,[r1,r1,r1],material,8);sphere(parent,name+' junta B',b,[r2,r2,r2],material,8);return m;
}
function createMaterials(){
  mat('skin',CFG.skin);mat('skinLight',CFG.skinLight);mat('hair',CFG.hair);
  mat('cloth',CFG.cloth);mat('sash',CFG.sash);mat('wood',CFG.wood);mat('gold',CFG.gold);
  mat('dark',0x30251e);mat('eye',0x170f0c);mat('seed',0x30251d);
  mat('leaf',0x40583a);mat('leafLight',0x6d7841);mat('stone',0x8b7658);
}
function buildRig(){
  const root=group(scene,'Personagem');
  const hips=group(root,'hips',0,.93,0);
  const spine=group(hips,'spine',0,0,0);
  const chest=group(spine,'chest',0,.39,0);
  const neck=group(chest,'neck',0,.18,0);
  const head=group(neck,'head',0,.105,0);
  const shoulderL=group(chest,'shoulderL',-.235,.015,0);
  const shoulderR=group(chest,'shoulderR',.235,.015,0);
  const elbowL=group(shoulderL,'elbowL',0,-.29,0);
  const elbowR=group(shoulderR,'elbowR',0,-.29,0);
  const wristL=group(elbowL,'wristL',0,-.265,0);
  const wristR=group(elbowR,'wristR',0,-.265,0);
  const hipL=group(hips,'hipL',-.115,-.015,0);
  const hipR=group(hips,'hipR',.115,-.015,0);
  const kneeL=group(hipL,'kneeL',0,-.46,0);
  const kneeR=group(hipR,'kneeR',0,-.46,0);
  const ankleL=group(kneeL,'ankleL',0,-.39,0);
  const ankleR=group(kneeR,'ankleR',0,-.39,0);
  return {root,hips,spine,chest,neck,head,shoulderL,shoulderR,elbowL,elbowR,wristL,wristR,hipL,hipR,kneeL,kneeR,ankleL,ankleR};
}
function registerPick(meshObj,title,paragraphs){
  meshObj.userData.info={title,paragraphs};pickables.push(meshObj);return meshObj;
}
function buildTorso(r){
  // Perfil de revolução: cintura mais estreita e tórax mais largo.
  const profile=[
    new THREE.Vector2(.135,-.015),new THREE.Vector2(.145,.08),
    new THREE.Vector2(.17,.19),new THREE.Vector2(.205,.34),
    new THREE.Vector2(.22,.47),new THREE.Vector2(.18,.54),
    new THREE.Vector2(.12,.56)
  ];
  const torso=mesh(r.spine,new THREE.LatheGeometry(profile,9),mat('skin'),'Torso',0,.02,0);
  torso.rotation.x=Math.PI; // Lathe cresce no eixo Y; inverte para encaixar no quadril.
  torso.rotation.x=0;
  registerPick(torso,'Corpo e trabalho',[
    'A vida em Palmares não se resumia ao combate. A produção de alimentos, a construção e a organização comunitária eram fundamentais para a autonomia dos mocambos.',
    'O corpo foi desenhado como o de um adulto habituado ao trabalho físico, sem transformar força em caricatura.'
  ]);
  sphere(r.chest,'peitoral esquerdo',[-.105,.015,.015],[.13,.18,.13],mat('skin'));
  sphere(r.chest,'peitoral direito',[.105,.015,.015],[.13,.18,.13],mat('skin'));
}
function buildHead(r){
  capsule(r.neck,'Pescoço',[0,-.015,0],[0,.14,0],.075,.075,mat('skin'));
  const h=sphere(r.head,'Rosto',[0,.015,0],[.115,.145,.105],mat('skin'),12);
  registerPick(h,'Rosto e cabelo',[
    'O rosto não recebe pinturas ou marcas decorativas inventadas. A expressão neutra e atenta procura apresentar uma pessoa, não um estereótipo de guerreiro.',
    'As fontes sobre Palmares registram uma comunidade diversa, formada por africanos, descendentes e povos indígenas em relações de troca e conflito.'
  ]);
  // Orelhas, nariz e narinas
  sphere(r.head,'orelha esquerda',[-.112,.02,0],[.025,.052,.027],mat('skinLight'));
  sphere(r.head,'orelha direita',[.112,.02,0],[.025,.052,.027],mat('skinLight'));
  capsule(r.head,'Ponte do nariz',[0,.055,.085],[0,-.005,.12],.018,.022,mat('skinLight'),7);
  sphere(r.head,'narina esquerda',[-.019,-.009,.115],[.009,.006,.006],mat('dark'),7);
  sphere(r.head,'narina direita',[.019,-.009,.115],[.009,.006,.006],mat('dark'),7);
  // Olhos pequenos, sem esclera branca.
  for(const side of [-1,1]){
    const eye=sphere(r.head,'olho', [side*.045,.035,.092],[.014,.009,.009],mat('eye'),8);
    eyeMeshes.push(eye);
    capsule(r.head,'sobrancelha',[side*.025,.061,.092],[side*.065,.058,.087],.006,.004,mat('hair'),5);
  }
  capsule(r.head,'lábio superior',[-.027,-.043,.092],[.027,-.043,.092],.008,.008,mat('dark'),6);
  capsule(r.head,'lábio inferior',[-.021,-.058,.09],[.021,-.058,.09],.006,.006,mat('skinLight'),6);
}
function buildHair(r){
  const hair=sphere(r.head,'Cabelo crespo',[0,.105,-.005],[.125,.085,.115],mat('hair'),2);
  // Massa única facetada: evita dezenas de esferas soltas.
  sphere(r.head,'volume posterior do cabelo',[0,.055,-.065],[.12,.10,.065],mat('hair'),1);
  registerPick(hair,'Cabelo crespo',[
    'O cabelo curto e crespo é uma escolha visual possível, não uma afirmação sobre a aparência de todos os habitantes de Palmares.',
    'A caracterização evita adereços genéricos e deixa a identidade do personagem aparecer pela postura, pelo rosto e pelo contexto.'
  ]);
}
function buildArms(r){
  for(const [side,shoulder,elbow,wrist] of [['esquerdo',r.shoulderL,r.elbowL,r.wristL],['direito',r.shoulderR,r.elbowR,r.wristR]]){
    sphere(shoulder,'deltoide '+side,[0,-.015,0],[.09,.105,.09],mat('skin'));
    capsule(shoulder,'braço superior '+side,[0,0,0],[0,-.29,0],.075,.058,mat('skin'),9);
    capsule(elbow,'antebraço '+side,[0,0,0],[0,-.265,0],.052,.04,mat('skin'),9);
    sphere(elbow,'cotovelo '+side,[0,-.012,0],[.055,.055,.055],mat('skin'));
    sphere(wrist,'pulso '+side,[0,0,0],[.038,.04,.038],mat('skin'));
  }
}
function buildHands(r){
  function makeHand(wrist,side){
    const palm=sphere(wrist,'mão '+side,[0,-.045,.012],[.055,.075,.027],mat('skin'));
    registerPick(palm,'Mãos',[
      'As mãos representam tanto o trabalho agrícola quanto tarefas de construção, preparo de alimentos e defesa.',
      'Os dedos são simplificados para manter a leitura visual e reduzir o custo geométrico.'
    ]);
    // Quatro dedos, três segmentos cada, e polegar articulado.
    for(let i=0;i<4;i++){
      const x=(i-1.5)*.025, length=.055-(Math.abs(i-1.5)*.006);
      let y=-.095;
      for(let j=0;j<3;j++){
        const len=length/3, end=[x+(i-1.5)*.003,y-len,.015];
        capsule(wrist,'dedo '+side,[x,y,.015],end,.009-j*.001,.007-j*.001,mat('skin'),6);
        x; y-=len;
      }
    }
    capsule(wrist,'polegar '+side,[-.045,-.04,.018],[-.067,-.083,.025],.014,.01,mat('skin'),7);
  }
  makeHand(r.wristL,'esquerda');makeHand(r.wristR,'direita');
}
function buildLegs(r){
  for(const [side,hip,knee,ankle] of [['esquerda',r.hipL,r.kneeL,r.ankleL],['direita',r.hipR,r.kneeR,r.ankleR]]){
    sphere(hip,'quadril '+side,[0,-.025,0],[.105,.12,.105],mat('skin'));
    capsule(hip,'coxa '+side,[0,0,0],[0,-.46,0],.105,.067,mat('skin'),10);
    sphere(knee,'joelho '+side,[0,0,0],[.069,.07,.07],mat('skin'));
    capsule(knee,'panturrilha '+side,[0,0,0],[0,-.39,0],.065,.042,mat('skin'),9);
    sphere(ankle,'tornozelo '+side,[0,0,0],[.045,.05,.045],mat('skin'));
  }
}
function buildFeet(r){
  for(const [side,ankle] of [['esquerdo',r.ankleL],['direito',r.ankleR]]){
    const foot=sphere(ankle,'pé '+side,[0,-.025,.075],[.065,.035,.12],mat('skin'));
    registerPick(foot,'Pés descalços',[
      'Os pés descalços ajudam a comunicar contato direto com o solo e uma vida cotidiana ligada ao ambiente.',
      'A forma é deliberadamente simples; não há calçado ou acessório ornamental.'
    ]);
    for(let i=0;i<5;i++){
      const x=(i-2)*.022;
      sphere(ankle,'dedo do pé',[x,-.028,.17-Math.abs(i-2)*.009],[.012,.018,.032],mat('skin'),7);
    }
  }
}
function buildClothes(r){
  const shorts=mesh(r.hips,new THREE.CylinderGeometry(.17,.205,.28,9,1,true),mat('cloth'),'Calção',0,-.055,0);
  shorts.position.y=-.055;
  // Painéis frontais de tecido para evitar aparência de cilindro rígido.
  for(const side of [-1,1]){
    const panel=mesh(r.hips,new THREE.BoxGeometry(.14,.23,.018),mat('cloth'),'painel do calção',side*.075,-.12,.13);
    panel.rotation.z=side*.08;
  }
  const sash=mesh(r.hips,new THREE.TorusGeometry(.18,.025,6,12),mat('sash'),'Faixa de cintura',0,.075,0);
  sash.rotation.x=Math.PI/2;
  registerPick(sash,'Faixa de tecido',[
    'A faixa em tom de terra é uma escolha de composição inspirada na variedade de tecidos e formas de vestir do mundo atlântico.',
    'Não deve ser entendida como uniforme comprovado de Palmares. A documentação disponível não sustenta um traje único para toda a população.'
  ]);
  // Colar discreto de sementes e dois búzios estilizados.
  const necklace=group(r.chest,'Colar',0,.08,.02);
  for(let i=0;i<13;i++){
    const a=Math.PI+(i/12)*Math.PI;
    sphere(necklace,'semente',[Math.cos(a)*.12,-.02+Math.sin(a)*.105,.11],[.012,.014,.012],mat('seed'),7);
  }
  for(const x of [-.055,.055]){
    const shell=sphere(necklace,'búzio',[x,-.115,.13],[.018,.031,.014],mat('gold'),8);
    shell.rotation.z=x*4;
  }
  registerPick(necklace,'Colar de sementes e búzios',[
    'O colar é um elemento narrativo discreto, feito de contas e duas formas inspiradas em búzios.',
    'Adornos pessoais variavam entre indivíduos e contextos. A peça não representa um símbolo oficial ou universal de Palmares.'
  ]);
}
function buildProps(r){
  // A lança simples é filha do punho direito; acompanha qualquer rotação do braço.
  const weapon=group(r.wristR,'Lança funcional',-.025,-.105,.035);
  const shaft=mesh(weapon,new THREE.CylinderGeometry(.012,.016,.95,7),mat('wood'),'haste',0,-.39,0);
  shaft.rotation.x=-Math.PI/2;
  const tip=mesh(weapon,new THREE.ConeGeometry(.025,.13,6),mat('dark'),'ponta',0,.12,0);
  tip.rotation.x=-Math.PI/2;
  weapon.rotation.x=-.18;weapon.rotation.z=-.15;
  registerPick(shaft,'Lança simples',[
    'A arma foi reduzida a uma haste de madeira com ponta estreita, sem escala monumental ou decoração fantástica.',
    'A presença da lança é uma decisão de linguagem visual para este personagem, não uma afirmação de que todos os moradores de Palmares utilizassem o mesmo armamento.'
  ]);
  r.weapon=weapon;
}
function buildCharacter(){
  rig=buildRig();
  character=rig.root;
  buildTorso(rig);buildHead(rig);buildHair(rig);buildArms(rig);
  buildLegs(rig);buildHands(rig);buildFeet(rig);buildClothes(rig);buildProps(rig);
  // Ajuste de leve assimetria: peso repousa na perna esquerda.
  rig.hips.rotation.z=-.025;rig.hipR.rotation.z=-.035;
  return rig.root;
}
function makeGroundTexture(){
  const c=document.createElement('canvas');c.width=256;c.height=256;
  const ctx=c.getContext('2d');ctx.fillStyle='#72583d';ctx.fillRect(0,0,256,256);
  for(let i=0;i<1800;i++){
    const x=Math.random()*256,y=Math.random()*256,r=Math.random()*2.2;
    ctx.fillStyle=['#8b704d','#59442f','#a1845c','#6a5037'][i%4];
    ctx.globalAlpha=.15+Math.random()*.25;ctx.beginPath();ctx.ellipse(x,y,r,r*.55,Math.random(),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(7,7);return tex;
}
function buildPalm(parent,x,z,scale=1){
  const palm=group(parent,'Palmeira',x,0,z);palm.scale.setScalar(scale);
  const trunk=mesh(palm,new THREE.CylinderGeometry(.09,.15,2.3,6),mat('wood'),'tronco',0,1.15,0);
  trunk.rotation.z=-.08;
  sphere(palm,'copa',[0,2.28,0],[.18,.14,.18],mat('wood'),1);
  for(let i=0;i<7;i++){
    const a=i*Math.PI*2/7;
    const leaf=mesh(palm,new THREE.ConeGeometry(.12,.95,4),mat(i%2?'leaf':'leafLight'),'folha',Math.cos(a)*.42,2.22+Math.sin(i*2)*.08,Math.sin(a)*.42);
    leaf.rotation.z=Math.cos(a)*1.15;leaf.rotation.x=Math.sin(a)*1.15;leaf.scale.y=1.6;
  }
}
function buildEnvironment(){
  const groundGeo=new THREE.PlaneGeometry(40,40,50,50);
  const pos=groundGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    pos.setZ(i,Math.sin(x*.8)*.018+Math.cos(y*.65)*.014);
  }
  groundGeo.computeVertexNormals();
  const groundMat=new THREE.MeshStandardMaterial({map:makeGroundTexture(),color:0xffffff,roughness:1});
  const ground=mesh(scene,groundGeo,groundMat,'Terra batida');ground.rotation.x=-Math.PI/2;ground.position.y=-.025;
  buildPalm(scene,-3.5,-4.8,1.2);buildPalm(scene,3.9,-5.2,.95);buildPalm(scene,5.2,-1.5,.72);
  // Pedras pequenas e espaçadas dão escala ao terreno.
  for(let i=0;i<18;i++){
    const x=Math.sin(i*12.3)*5,z=Math.cos(i*7.7)*4;
    if(Math.hypot(x,z)<1.7)continue;
    const rock=mesh(scene,new THREE.DodecahedronGeometry(.07+(i%3)*.025,0),mat('stone'),'pedrisco',x,.025,z);
    rock.rotation.set(i*.2,i*.4,i*.1);
  }
  buildFire();
}
function buildFire(){
  fireGroup=group(scene,'Fogueira',CFG.fire.x,0,CFG.fire.z);
  for(let i=0;i<7;i++){
    const a=i*Math.PI*2/7;
    const log=mesh(fireGroup,new THREE.CylinderGeometry(.045,.05,.48,6),mat('wood'),'lenha',Math.cos(a)*.16,.09,Math.sin(a)*.16);
    log.rotation.z=Math.PI/2;log.rotation.y=a;
  }
  const flameMat=new THREE.MeshBasicMaterial({color:0xff9b3d,transparent:true,opacity:.8});
  for(let i=0;i<3;i++){
    const flame=mesh(fireGroup,new THREE.ConeGeometry(.11-i*.018,.42-i*.06,6),flameMat,'chama',0,.31+i*.08,0);
    flame.userData.phase=i*1.8;
  }
  fireLight=new THREE.PointLight(0xff9b53,2.2,8,2);fireLight.position.set(CFG.fire.x,.7,CFG.fire.z);scene.add(fireLight);
  const emberMat=new THREE.MeshBasicMaterial({color:0xffb45e});
  for(let i=0;i<14;i++){
    const e=mesh(scene,new THREE.IcosahedronGeometry(.012,0),emberMat,'brasa');
    e.visible=false;embers.push({mesh:e,phase:Math.random()*4,offset:Math.random()*Math.PI*2});
  }
}
function setupLighting(){
  scene.background=new THREE.Color(0x9b8061);
  scene.fog=new THREE.Fog(0x9b8061,9,24);
  const hemi=new THREE.HemisphereLight(0x9eb6c7,0x493323,.8);scene.add(hemi);
  const key=new THREE.DirectionalLight(0xffd09a,2.4);key.position.set(-4,7,5);key.castShadow=true;
  key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;scene.add(key);
  const rim=new THREE.DirectionalLight(0xf5b85e,1.35);rim.position.set(3,4,-4);scene.add(rim);
  const fill=new THREE.DirectionalLight(0x829ebc,.45);fill.position.set(4,2,5);scene.add(fill);
  scene.userData.key=key;scene.userData.hemi=hemi;
}
function setupRenderer(){
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  document.querySelector('#stage').appendChild(renderer.domElement);
  camera=new THREE.PerspectiveCamera(CFG.camera.fov,innerWidth/innerHeight,CFG.camera.near,CFG.camera.far);
  camera.position.set(3.3,2.25,5.4);
  controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.9,0);
  controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=2.7;controls.maxDistance=9;
  controls.maxPolarAngle=Math.PI*.49;controls.minPolarAngle=.18;controls.update();
}
function setPose(next){
  if(!['idle','walk','attack','wave','plant'].includes(next))return;
  pose=next;poseTime=0;transition=0;
  document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('active',b.dataset.pose===next));
}
function setupAnimations(){
  // A máquina mantém uma pose-base e aplica movimentos pequenos e temporizados.
  return {update:updateAnimation};
}
function resetPoseTargets(){
  const nodes=[rig.hips,rig.spine,rig.chest,rig.head,rig.shoulderL,rig.shoulderR,rig.elbowL,rig.elbowR,rig.hipL,rig.hipR,rig.kneeL,rig.kneeR,rig.ankleL,rig.ankleR,rig.wristL,rig.wristR];
  return nodes.map(n=>({n,p:n.position.clone(),r:n.rotation.clone()}));
}
const restPose=()=>resetPoseTargets();
let rest=[];
function applyRotation(node,x,y,z,weight=1){
  node.rotation.x=THREE.MathUtils.lerp(node.rotation.x,x,weight);
  node.rotation.y=THREE.MathUtils.lerp(node.rotation.y,y,weight);
  node.rotation.z=THREE.MathUtils.lerp(node.rotation.z,z,weight);
}
function updateAnimation(dt){
  poseTime+=dt;transition=Math.min(1,transition+dt*4);
  // Recoloca os grupos nos valores neutros antes de misturar a pose escolhida.
  for(const s of rest){s.n.position.lerp(s.p,Math.min(1,dt*8));s.n.rotation.x=THREE.MathUtils.damp(s.n.rotation.x,s.r.x,8,dt);s.n.rotation.y=THREE.MathUtils.damp(s.n.rotation.y,s.r.y,8,dt);s.n.rotation.z=THREE.MathUtils.damp(s.n.rotation.z,s.r.z,8,dt);}
  const t=poseTime,fade=transition;
  if(pose==='idle'){
    // Respiração lenta; piscadas e olhares são eventos espaçados, não loops agitados.
    const breath=Math.sin(t*Math.PI*2/6)*.008;
    rig.chest.scale.y=1+breath;
    if(elapsed>=nextBlink){blinkStart=elapsed;nextBlink=elapsed+4+Math.random()*4;}
    const blinkAge=elapsed-blinkStart;
    const blinkAmount=blinkAge>=0&&blinkAge<.16?Math.sin(Math.PI*blinkAge/.16):0;
    eyeMeshes.forEach(e=>{e.scale.y=.009*(1-.88*blinkAmount);});
    if(elapsed>=nextLook){lookStart=elapsed;lookYaw=(Math.random()-.5)*.11;nextLook=elapsed+10+Math.random()*5;}
    const lookAge=elapsed-lookStart;
    const lookWeight=lookAge>=0&&lookAge<2?Math.sin(Math.PI*lookAge/2):0;
    applyRotation(rig.head,0,lookYaw*lookWeight,0,fade);
  }else{
    rig.chest.scale.y=1;
  }
  if(pose==='walk'){
    const w=t*Math.PI*2/CFG.duration.walk;
    rig.hips.position.y=.93+Math.abs(Math.sin(w))*.015;
    applyRotation(rig.hipL,Math.sin(w)*.48,0,0,fade);
    applyRotation(rig.hipR,Math.sin(w+Math.PI)*.48,0,0,fade);
    applyRotation(rig.kneeL,Math.max(0,-Math.sin(w))*.72,0,0,fade);
    applyRotation(rig.kneeR,Math.max(0,-Math.sin(w+Math.PI))*.72,0,0,fade);
    applyRotation(rig.ankleL,Math.max(0,Math.sin(w))*.3,0,0,fade);
    applyRotation(rig.ankleR,Math.max(0,Math.sin(w+Math.PI))*.3,0,0,fade);
    applyRotation(rig.shoulderL,-Math.sin(w)*.3,0,0,fade);
    applyRotation(rig.shoulderR,-Math.sin(w+Math.PI)*.3,0,0,fade);
    applyRotation(rig.elbowL,-.12,0,0,fade);applyRotation(rig.elbowR,-.12,0,0,fade);
  }
  if(pose==='attack'){
    const a=poseTime,wind=smooth(0,.3,a),thrust=smooth(.3,.5,a),recover=smooth(.5,1,a);
    if(a<.3){applyRotation(rig.chest,-.16*wind,0,0,fade);applyRotation(rig.shoulderR,-.65*wind,0,-.25*wind,fade);applyRotation(rig.elbowR,-.8*wind,0,0,fade);}
    else if(a<.5){const p=(a-.3)/.2;applyRotation(rig.chest,.12*p,0,0,fade);applyRotation(rig.shoulderR,-.65+1.05*p,0,-.25,fade);applyRotation(rig.elbowR,-.8+.65*p,0,0,fade);}
    else{const q=1-recover;applyRotation(rig.chest,.12*q,0,0,fade);applyRotation(rig.shoulderR,.4*q,0,-.25*q,fade);applyRotation(rig.elbowR,-.15*q,0,0,fade);}
    if(a>1)setPose('idle');
  }
  if(pose==='wave'){
    const rise=smooth(0,.3,t),lower=1-smooth(.9,1.2,t);
    const arm=rise*lower;
    applyRotation(rig.shoulderR,-2.35*arm,0,-.18*arm,fade);
    applyRotation(rig.elbowR,-.45*arm,0,0,fade);
    const wave=Math.sin(Math.max(0,t-.3)*Math.PI*2*3)*.35;
    applyRotation(rig.wristR,0,0,wave*arm,fade);
    if(t>1.25)setPose('idle');
  }
  if(pose==='plant'){
    const down=smooth(0,.5,t),touch=smooth(.5,1,t),up=1-smooth(1,1.5,t);
    const squat=down*(1-smooth(1,1.5,t));
    rig.hips.position.y=.93-.23*squat;
    applyRotation(rig.hipL,-.5*squat,0,0,fade);applyRotation(rig.hipR,-.5*squat,0,0,fade);
    applyRotation(rig.kneeL,.85*squat,0,0,fade);applyRotation(rig.kneeR,.85*squat,0,0,fade);
    applyRotation(rig.chest,.22*down*up,0,0,fade);
    applyRotation(rig.shoulderR,-1.2*down*up,0,-.25*down*up,fade);
    applyRotation(rig.elbowR,-.5*down*up,0,0,fade);
    if(t>1.55)setPose('idle');
  }
  // Olhos acompanham discretamente o cursor apenas no estado de repouso.
  if(pose==='idle'&&eyeMeshes.length){
    const gazeX=pointer.x*.018,gazeY=pointer.y*.012;
    eyeMeshes.forEach(e=>{e.position.x=THREE.MathUtils.damp(e.position.x,Math.sign(e.position.x)*.045+gazeX,3,dt);e.position.y=THREE.MathUtils.damp(e.position.y,.035+gazeY,3,dt);});
  }else{eyeMeshes.forEach(e=>{e.scale.y=THREE.MathUtils.damp(e.scale.y,.009,8,dt);});}
}
function updateDaylight(value){
  dayValue=value;const phase=(value/24)*Math.PI*2-Math.PI/2;
  const sunHeight=Math.sin(phase),sunX=Math.cos(phase);
  const key=scene.userData.key;
  key.position.set(-sunX*6,Math.max(1.2,3+sunHeight*5),5);
  key.color.setHSL(.09+Math.max(0,sunHeight)*.025,.65,.62);
  key.intensity=.65+Math.max(0,sunHeight)*2.0;
  const sky=new THREE.Color().setHSL(.58-Math.max(0,sunHeight)*.48,.28,.12+Math.max(0,sunHeight)*.42);
  scene.background.copy(sky);scene.fog.color.copy(sky);
  document.querySelector('#hour').textContent=String(Math.floor(value)).padStart(2,'0')+':'+String(Math.round((value%1)*60)).padStart(2,'0');
}
function showInfo(data){
  if(!data)return;
  document.querySelector('#infoTitle').textContent=data.title;
  const box=document.querySelector('#infoText');box.replaceChildren();
  data.paragraphs.forEach(p=>{const el=document.createElement('p');el.textContent=p;box.appendChild(el);});
  document.querySelector('#info').classList.add('open');
}
function setupInteraction(){
  document.querySelectorAll('[data-pose]').forEach(b=>b.addEventListener('click',()=>setPose(b.dataset.pose)));
  document.querySelector('#daytime').addEventListener('input',e=>updateDaylight(Number(e.target.value)));
  document.querySelector('#close').addEventListener('click',()=>document.querySelector('#info').classList.remove('open'));
  document.querySelector('#photo').addEventListener('click',()=>document.body.classList.add('photo'));
  document.querySelector('#photoExit').addEventListener('click',()=>document.body.classList.remove('photo'));
  renderer.domElement.addEventListener('pointermove',onPointerMove);
  renderer.domElement.addEventListener('click',onPointerClick);
  window.addEventListener('resize',onResize);
}
function updateRay(event){
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  return raycaster.intersectObjects(pickables,true);
}
function onPointerMove(e){
  const hits=updateRay(e),found=hits.find(h=>h.object.userData.info)?.object||null;
  if(hovered&&hovered.material&&hovered.material.emissive)hovered.material.emissive.setHex(0x000000);
  hovered=found;
  if(hovered&&hovered.material&&hovered.material.emissive)hovered.material.emissive.setHex(0x332011);
  renderer.domElement.style.cursor=hovered?'pointer':'grab';
}
function onPointerClick(e){
  const hits=updateRay(e),hit=hits.find(h=>h.object.userData.info);
  if(hit)showInfo(hit.object.userData.info);
}
function onResize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
}
function updateFire(time,dt){
  fireLight.intensity=2.0+Math.sin(time*7)*.18+Math.sin(time*11.7)*.12;
  fireGroup.children.forEach(child=>{
    if(child.name==='chama'){child.scale.y=.88+Math.sin(time*8+child.userData.phase)*.12;child.rotation.y=Math.sin(time*5+child.userData.phase)*.12;}
  });
  embers.forEach((e,i)=>{
    const p=(time*.32+e.phase)%1;
    e.mesh.visible=p>.05;
    e.mesh.position.set(CFG.fire.x+Math.sin(time*2+e.offset)*.18,.15+p*.95,CFG.fire.z+Math.cos(time*1.7+e.offset)*.14);
    e.mesh.scale.setScalar(.4+(1-p)*.7);
    if(p>.82)e.mesh.visible=false;
  });
}
function disposeScene(){
  scene.traverse(obj=>{
    if(obj.geometry)obj.geometry.dispose();
    if(obj.material){if(Array.isArray(obj.material))obj.material.forEach(m=>m.dispose());else obj.material.dispose();}
  });
  renderer.dispose();
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
  updateAnimation(dt);updateFire(elapsed,dt);
  controls.update();renderer.render(scene,camera);
}
function init(){
  scene=new THREE.Scene();createMaterials();setupLighting();setupRenderer();
  buildEnvironment();buildCharacter();rest=restPose();setupAnimations();setupInteraction();updateDaylight(dayValue);
  animate();
}
init();
</script>
</body>
